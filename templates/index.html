<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PPT Generator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Presentation Generator</h1>
            <p class="subtitle">Enter a topic and let AI create a professional slide deck for you</p>
        </header>

        <form id="ppt-form">
            <!-- Topic (required) -->
            <div class="form-group">
                <label for="topic">Topic <span class="required">*</span></label>
                <input
                    type="text" id="topic" name="topic"
                    placeholder="e.g., Artificial Intelligence in Healthcare, 碳中和研究报告..."
                    required minlength="2" maxlength="500"
                >
                <span class="hint">Describe your presentation topic in detail for better results</span>
            </div>

            <!-- Slide count + Style -->
            <div class="form-row">
                <div class="form-group">
                    <label for="slide_count">Number of Slides</label>
                    <input
                        type="number" id="slide_count" name="slide_count"
                        min="3" max="20" value="10"
                    >
                </div>
                <div class="form-group">
                    <label for="style">Visual Style</label>
                    <select id="style" name="style">
                        <option value="professional">Professional Blue</option>
                        <option value="creative">Creative Warm</option>
                        <option value="academic">Academic Green</option>
                        <option value="minimal">Minimal Dark</option>
                        <option value="modern_dark">Modern Dark (Tech)</option>
                        <option value="warm_sunset">Warm Sunset</option>
                        <option value="ocean_teal">Ocean Teal</option>
                        <option value="bold_red">Bold Red (Pitch)</option>
                    </select>
                </div>
            </div>

            <!-- Language + Tone -->
            <div class="form-row">
                <div class="form-group">
                    <label for="language">Language</label>
                    <select id="language" name="language">
                        <option value="english">English</option>
                        <option value="chinese">Chinese (中文)</option>
                        <option value="bilingual">Bilingual</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tone">Tone</label>
                    <select id="tone" name="tone">
                        <option value="semi-formal" selected>Semi-formal</option>
                        <option value="formal">Formal</option>
                        <option value="casual">Casual</option>
                    </select>
                </div>
            </div>

            <!-- Audience (optional) -->
            <div class="form-group">
                <label for="audience">Target Audience (optional)</label>
                <input
                    type="text" id="audience" name="audience"
                    placeholder="e.g., college students, executives, technical team"
                >
            </div>

            <!-- Checkboxes -->
            <div class="form-row checkboxes">
                <label class="checkbox-label">
                    <input
                        type="checkbox" id="include_emojis"
                        name="include_emojis" checked
                    >
                    Include emoji icons
                </label>
                <label class="checkbox-label">
                    <input
                        type="checkbox" id="include_speaker_notes"
                        name="include_speaker_notes"
                    >
                    Include speaker notes
                </label>
            </div>

            <!-- Submit -->
            <button type="submit" id="generate-btn">
                Generate Presentation
            </button>

            <!-- Status -->
            <div id="status" class="hidden">
                <div class="spinner"></div>
                <p id="status-text">AI is crafting your slides...</p>
            </div>

            <!-- Error -->
            <div id="error" class="hidden"></div>
        </form>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
